# Cloudflare Worker for Parabull media (README.md). Deploy: npx wrangler@4 deploy
name = "parabull-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The bucket's public custom domain (R2 > parabull-media > Settings > Custom Domains). https, no trailing slash.
MEDIA_PUBLIC_URL = "https://media.example.com"
# Origins allowed to call the Worker (uploads, chat sign-in, chat sockets): the frontend canister's URL and any custom
# domain, comma-separated. Anything else is refused, so until this is set everything fails closed.
ALLOWED_ORIGINS = "https://frontend-canister-id.icp0.io"
# Cloudflare Stream (GET /live, POST /live/input): the account's id (32 hex characters) and its Stream customer host.
# The API token (Stream Write, which also reads) is a secret: npx wrangler@4 secret put CF_STREAM_TOKEN. Without all
# three, both answer 503.
CF_ACCOUNT_ID = "00000000000000000000000000000000"
STREAM_HOST = "customer-CODE.cloudflarestream.com"
# Solana JSON-RPC for the cluster Parabull is on: POST /live/input reads the coin's bonding curve to check its creator.
# PARABULL_PROGRAM_ID overrides the program id when it differs from the committed IDL's.
SOLANA_RPC_URL = "https://api.devnet.solana.com"
# The Parabull indexer (services/parabull-indexer): POST /callouts records the coin's market cap from it. Without it,
# posting a callout answers 503 (reading still works).
INDEXER_URL = "https://indexer.example.com"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "parabull-media"

# Per-IP upload limit (src/index.ts UPLOAD_LIMITER). namespace_id is any integer unique to this account's limits.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Chat sign-ins and uploads, per IP (src/router.ts CHAT_LIMITER).
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Chat socket handshakes, per IP (src/router.ts CHAT_CONNECT_LIMITER): bounds how many rooms one client opens.
[[ratelimits]]
name = "CHAT_CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# One ChatRoom per coin mint (src/chatRoomDO.ts): WebSocket Hibernation, history in the object's SQLite storage.
[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

# Callout reads, per IP (src/router.ts CALLOUT_READ_LIMITER): every read reaches the one CalloutStore object.
[[ratelimits]]
name = "CALLOUT_READ_LIMITER"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

# Every callout, in one object's SQLite (src/calloutStoreDO.ts), so per-wallet posting limits apply in one place.
[[durable_objects.bindings]]
name = "CALLOUTS"
class_name = "CalloutStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CalloutStore"]

# CHAT_SECRET (HMAC key for chat session tokens, 32+ characters) is a secret, not a var:
#   openssl rand -base64 48 | npx wrangler@4 secret put CHAT_SECRET
# Without it, chat stays read-only: sign-in answers 503 and no token verifies.
