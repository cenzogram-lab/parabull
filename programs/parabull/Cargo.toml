[package]
name = "parabull"
version = "0.1.0"
description = "Parabull bonding-curve launchpad: blind launches, ticker registry, 1% fee flywheel, Raydium CPMM graduation"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "parabull"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
# Differential tests call the reconstructed pump.fun curve math directly.
pump-recovered = { path = "../../reference/programs/pump", features = ["no-entrypoint"] }
