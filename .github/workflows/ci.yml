name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANCHOR_CLI_VERSION: 0.31.1
  # Each solana-program-test binary is ~440 MB with full debug info; line
  # tables keep backtraces useful at a fraction of the size and link time.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  cargo:
    name: cargo test (program)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parabull
      # Unit, reference-parity and solana-program-test runtime suites.
      - name: cargo test
        run: cargo test -p parabull --locked
      - name: cargo check (IDL build)
        run: cargo check -p parabull --features idl-build --locked

  scripts:
    name: scripts (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parabull

      # The scripts are typed against target/types/parabull.ts, which the
      # Anchor CLI generates from the program. Built from crates.io source and
      # cached; no Solana toolchain is needed for IDL generation.
      - name: Cache Anchor CLI
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_CLI_VERSION }}-${{ runner.os }}
      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version "$ANCHOR_CLI_VERSION" --locked
      - name: Generate IDL + TS types
        run: |
          mkdir -p target/idl target/types
          anchor idl build -p parabull -o target/idl/parabull.json -t target/types/parabull.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: npm ci
        working-directory: scripts
        run: npm ci
      - name: Typecheck scripts against the IDL
        working-directory: scripts
        run: npm run typecheck
      - name: Script unit tests
        working-directory: scripts
        run: npm test
      # app/ commits a copy of the IDL so it builds without the Anchor CLI;
      # fail if that copy drifts from what the program generates.
      - name: App IDL copy matches the program
        run: node app/scripts/sync-idl.mjs --check

  app:
    name: app (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      - name: Unit tests (launch rules, quotes, Merkle proofs, demo data)
        working-directory: app
        run: npm test
      # Typechecks the app and its tests, then builds with Vite.
      - name: Build
        working-directory: app
        run: npm run build

  canister:
    name: canister (Motoko build + tests, PocketIC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: canisters/solana_signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            canisters/solana_signer/e2e/package-lock.json
      - name: Install mops and icp-cli
        run: npm install -g ic-mops@3.5.1 @icp-sdk/icp-cli@1.8.0 @icp-sdk/ic-wasm@0.11.1
      - name: mops install
        run: mops install
      # Compile errors, upgrade compatibility of the migration chain, and every warning (dot notation, unused
      # imports, redundant instantiation) as an error.
      - name: mops check
        run: mops check -- -Werror
      - name: Motoko unit tests (Base58, request checks, rate limits)
        run: mops test
      # Wasm + checks main.mo against solana_signer.did.
      - name: mops build
        run: mops build solana_signer
      # The canister as icp-cli builds it: icp.yaml -> canister.yaml -> @dfinity/motoko recipe.
      - name: icp build
        working-directory: .
        run: icp build solana_signer
      # The integration tests drive the app's own client (app/src/lib/auth/chainFusionSigner.ts).
      - name: npm ci (app)
        working-directory: app
        run: npm ci
      - name: npm ci (e2e, downloads PocketIC)
        working-directory: canisters/solana_signer/e2e
        run: npm ci
      - name: Typecheck the integration tests
        working-directory: canisters/solana_signer/e2e
        run: npm run typecheck
      - name: PocketIC integration tests (threshold Ed25519 key_1)
        working-directory: canisters/solana_signer/e2e
        run: npm test
