[workspace]
members = ["programs/parabull"]
# Byte-matching pump.fun reconstructions kept for reference only. Each one is
# its own standalone workspace with its own pins and patches; never build or
# deploy them as part of Parabull.
exclude = ["reference"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
