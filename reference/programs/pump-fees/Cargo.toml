[package]
name = "pump-fun-fees-candidate"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pump_fees_candidate"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
pump-fees-math = { path = "pump-fees-math" }
anchor-lang = { version = "=0.31.1", features = ["event-cpi", "init-if-needed"] }

anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }

# Standalone reference workspace. These settings (and the vendored
# anchor-attribute-program patch) previously lived in the repository root
# Cargo.toml; they are scoped here so they never leak into the Parabull build.
[workspace]
members = [".", "pump-fees-math"]
exclude = ["vendor/used-public"]
resolver = "2"

[profile.release]
panic = "abort"
overflow-checks = true
lto = false
codegen-units = 1

[patch.crates-io]
anchor-attribute-program = { path = "vendor/used-public" }
