# Internet Computer canisters:
# - frontend: the built app/, served by a certified-assets canister through the @dfinity/static-site recipe
#   (skills.internetcomputer.org "static-site" skill). The Parabull program, trades and launches stay on Solana, and
#   the app talks to Solana RPC from the browser as usual.
# - solana_signer (canisters/solana_signer/canister.yaml): the Chain Fusion signer behind the connect dialog's
#   "Continue with Google / Passkey / Email". Motoko, built by the @dfinity/motoko recipe from that directory's
#   mops.toml; see canisters/solana_signer/README.md.
#
#   npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm ic-mops   # icp-cli >= 1.0.0, Node.js >= 22
#   icp network start -d && icp deploy                  # local: http://frontend.local.localhost:8000
#   icp deploy -e ic frontend                           # mainnet (needs cycles): https://<canister-id>.icp.net
#   icp deploy -e ic solana_signer                      # mainnet signer; set VITE_II_SIGNER_CANISTER_ID to its ID
#
# Build configuration comes from app/.env.production.local (VITE_PARABULL_MODE, VITE_CLUSTER, VITE_RPC_URL, ...),
# read by Vite during `npm run build`. SPA routing is app/public/_redirects; security headers and the CSP are generated
# into dist/_headers by app/vite.config.ts (src/lib/icHeaders.ts), so connect-src follows the configured endpoints.
# Commit .icp/data/ (mainnet canister IDs); .icp/cache/ is ignored.
canisters:
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        # Inline canisters build from the project root, so target the app's package explicitly.
        build:
          - npm --prefix app ci
          - npm --prefix app run build
        dir: app/dist
  # Path-based: its canister.yaml and mops.toml live in that directory, which is also its build directory.
  - canisters/solana_signer
